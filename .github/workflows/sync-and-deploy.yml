name: Sync fleet sheet and deploy

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC). GitHub may start it a few minutes late.
  workflow_dispatch:         # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SHEET_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vQFR4gLNh98elyMPUuyc-oVN2DwcNd44-_jGEs5r2FVnkMmBk4LvDT57lKWIICaAJWsqcvDJ_h75sVK/pub?output=csv

jobs:
  sync-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sheet CSV
        run: |
          curl -fsSL "$SHEET_CSV_URL" -o /tmp/fleet.csv
          # Refuse to overwrite good data with an error page or a broken sheet
          if ! head -n 1 /tmp/fleet.csv | grep -qi "plate number"; then
            echo "::error::Header row missing 'Plate Number' - sheet layout changed or fetch failed"
            exit 1
          fi
          cp /tmp/fleet.csv data/fleet.csv
          date -u +%Y-%m-%dT%H:%M:%SZ > data/updated.txt

      - name: Commit data snapshot
        run: |
          git config user.name "fleet-sync-bot"
          git config user.email "fleet-sync-bot@users.noreply.github.com"
          git add data/
          git commit -m "Sync fleet data $(cat data/updated.txt)" || echo "No changes"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
